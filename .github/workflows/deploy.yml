name: Build and publish MintBlog

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mintblog-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  NODE_VERSION: '24.22.1'
  PNPM_VERSION: '10.34.7'

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit all dependencies, including the build toolchain
        run: pnpm audit

      - name: Sync Astro types
        run: pnpm sync

      - name: Check Astro and TypeScript
        run: pnpm check

      - name: Run ESLint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format

      - name: Run tests
        run: pnpm test

      - name: Build static site and search index
        run: pnpm build

  publish:
    name: Build and publish image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js for post date export
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Export post dates for the Git-free Docker build
        run: node --experimental-strip-types scripts/export-post-dates.ts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=sha-

      - name: Build and load image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          provenance: false
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test and publish the loaded image
        shell: bash
        env:
          TAGGED_IMAGE: ${{ steps.metadata.outputs.tags }}
        run: |
          image_id=$(docker image inspect --format '{{.Id}}' "$TAGGED_IMAGE")
          bash docker/smoke-test.sh "$image_id"
          if [[ $(docker image inspect --format '{{.Id}}' "$TAGGED_IMAGE") != "$image_id" ]]; then
            echo "Image tag changed after smoke test; refusing to push." >&2
            exit 1
          fi
          push_log="$RUNNER_TEMP/mintblog-push.log"
          docker image push "$TAGGED_IMAGE" | tee "$push_log"
          digest=$(awk -v tag="${TAGGED_IMAGE##*:}:" '$1 == tag && $2 == "digest:" { print $3 }' "$push_log")
          if [[ ! $digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not confirm the pushed manifest digest." >&2
            exit 1
          fi
          image="${TAGGED_IMAGE%:*}@$digest"
          {
            printf '### Published MintBlog image\n\n'
            printf -- '- Commit: `%s`\n- Image: `%s`\n\n' "$GITHUB_SHA" "$image"
            printf 'After deployment approval, run on the VPS:\n\n```bash\nbash deploy.sh %s\n```\n' "$image"
          } >> "$GITHUB_STEP_SUMMARY"

services:
  web:
    image: ${BLOG_IMAGE:?Set BLOG_IMAGE with bash deploy.sh and an approved GHCR image digest}
    restart: unless-stopped
    expose:
      - '80'
    networks:
      proxy:
        aliases:
          - mintblog

networks:
  proxy:
    name: ${MINTBLOG_PROXY_NETWORK:-npm_default}
    external: true
